<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Asisten Hukum</title>
<script>
  // plugins.js diambil dari Document Server sendiri (alamat diisi server); bila gagal, dari onlyoffice.github.io.
  (function () {
    var ds = "__DS_URL__";
    function load(src, ok, fail) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }
    function main() { load("plugin.js"); }
    function cdn() { load("https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js", main, function () { document.body.innerHTML = '<p style="padding:8px;color:#991b1b">Skrip editor tidak dapat dimuat.</p>'; }); }
    if (ds && ds.indexOf("__") !== 0) load(ds + "/sdkjs-plugins/v1/plugins.js", main, cdn); else cdn();
  })();
</script>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#222;background:#fff}
  #wrap{box-sizing:border-box;height:100%;padding:8px;display:flex;flex-direction:column;gap:6px}
  select,input,button{font-size:12px;box-sizing:border-box}
  select,input{width:100%;padding:6px;border:1px solid #c7c7c7;border-radius:4px}
  .row{display:flex;flex-wrap:wrap;gap:4px}
  .row button{padding:5px 8px;border:0;border-radius:12px;background:#eef2ff;color:#3730a3;cursor:pointer}
  .row button:hover{background:#e0e7ff}
  #sel{display:none;padding:6px;border-radius:4px;background:#fef3c7;color:#92400e;max-height:60px;overflow:auto}
  #log{flex:1 1 auto;min-height:0;overflow-y:auto}
  .q{background:#eef2ff;color:#3730a3;border-radius:6px;padding:6px;margin-top:6px;font-weight:bold}
  .a{background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:6px;margin-top:3px;white-space:pre-wrap;line-height:1.45}
  .a button{margin-top:6px;padding:5px 10px;border:0;border-radius:4px;background:#059669;color:#fff;cursor:pointer}
  #send{padding:6px 12px;border:0;border-radius:4px;background:#4f46e5;color:#fff;cursor:pointer}
  #msg{padding:6px;border-radius:4px;display:none}
  #msg.err{display:block;background:#fee2e2;color:#991b1b}
  .hint{color:#777;font-size:11px}
</style>
</head>
<body>
<div id="wrap">
  <select id="engine"><option value="gemini">Mesin: Gemini (cloud)</option></select>
  <div class="row" id="doc">
    <button data-a="review">Review &amp; Skor</button><button data-a="risks">Risiko</button><button data-a="missing">Klausul Hilang</button><button data-a="negotiate">Usul Negosiasi</button><button data-a="plain">Bahasa Awam</button>
  </div>
  <div class="hint">Pilih teks di dokumen lalu klik kanan → <b>Asisten AI</b>, atau pakai tombol di bawah.</div>
  <div class="row" id="selbtns">
    <button data-a="sel_ask">Jelaskan</button><button data-a="sel_rewrite">Tulis ulang</button><button data-a="sel_simplify">Sederhanakan</button><button data-a="sel_risk">Risiko</button><button data-a="sel_law">Dasar hukum</button><button data-a="sel_en">Ke Inggris</button>
  </div>
  <div id="sel"></div>
  <div id="msg"></div>
  <div id="log"></div>
  <div style="display:flex;gap:4px"><input id="q" placeholder="Tanya soal dokumen atau hukum…" autocomplete="off"><button id="send">Kirim</button></div>
</div>
</body>
</html>
