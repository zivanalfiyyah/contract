<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Panel CLM</title>
<script>
  (function () {
    var ds = "__DS_URL__";
    function load(src, ok, fail) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }
    function main() { load("plugin.js"); }
    function cdn() { load("https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js", main, function () { document.body.innerHTML = '<p style="padding:8px;color:#991b1b">Skrip editor tidak dapat dimuat.</p>'; }); }
    if (ds && ds.indexOf("__") !== 0) load(ds + "/sdkjs-plugins/v1/plugins.js", main, cdn); else cdn();
  })();
</script>
<style>
  html,body{margin:0;padding:0;height:100%;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#222;background:#fff}
  #wrap{box-sizing:border-box;height:100%;overflow-y:auto;padding:8px}
  h4{margin:12px 0 6px;font-size:12px;color:#4338ca;text-transform:uppercase;letter-spacing:.04em}
  h4:first-child{margin-top:0}
  label{display:block;margin:6px 0 2px;color:#555}
  input[type=text]{width:100%;box-sizing:border-box;padding:6px;border:1px solid #c7c7c7;border-radius:4px;font-size:12px}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  button{padding:6px 10px;border:1px solid #c7c7c7;border-radius:4px;background:#f5f5f5;cursor:pointer;font-size:12px}
  button.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
  button.go{background:#4f46e5;color:#fff;border-color:#4f46e5;margin-top:8px}
  button:disabled{opacity:.5;cursor:default}
  .chk{display:flex;align-items:center;gap:6px;margin:5px 0}
  #msg{margin:6px 0;padding:6px;border-radius:4px;display:none}
  #msg.ok{display:block;background:#dcfce7;color:#166534}
  #msg.err{display:block;background:#fee2e2;color:#991b1b}
  .hint{color:#777;font-size:11px;margin:4px 0}
</style>
</head>
<body>
<div id="wrap">
  <div id="msg"></div>
  <h4>Data pihak &amp; kontrak</h4>
  <div id="vars"><div class="hint">Memuat…</div></div>
  <button class="go" id="saveVars" style="display:none">Terapkan data ke dokumen</button>

  <h4>Bahasa dokumen</h4>
  <div class="row" id="lang">
    <button data-m="id">Indonesia</button>
    <button data-m="bilingual-side">ID + EN (kiri-kanan)</button>
    <button data-m="bilingual-stacked">ID + EN (atas-bawah)</button>
    <button data-m="en">English</button>
  </div>
  <div class="hint">Terjemahan memakai AI dan bisa memakan waktu beberapa saat.</div>

  <h4>Kop &amp; tanda tangan</h4>
  <div id="layout"></div>
  <div class="hint">Perubahan tata letak memuat ulang dokumen.</div>
</div>
</body>
</html>
